name: CI

on:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: '1'
  WRANGLER_SEND_METRICS: 'false'
  ASTRO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  release-policy:
    name: Dependency release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Check new dependency resolutions
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
          DEPENDENCY_SECURITY_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'security') }}
        run: |
          if ! git cat-file -e "$DEPENDENCY_POLICY_BASE^{commit}" 2>/dev/null; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$DEPENDENCY_POLICY_BASE"
          fi
          node .github/scripts/check-dependency-releases.mjs

  code:
    needs: release-policy
    name: Code (quick)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate code
        run: node scripts/quality.mjs code

  security:
    needs: release-policy
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate security
        run: node scripts/quality.mjs security

  quality:
    name: Quality Gates
    if: always() && github.event_name != 'schedule'
    needs: [code, security, release-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${name}: ${job.result}\n`);
          }
          if (Object.values(results).some(job => job.result !== 'success')) process.exit(1);
          JS
