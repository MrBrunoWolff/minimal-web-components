name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # typecheck + lint + format + knip, in parallel.
      - name: Check
        run: bun run check

      # The unit tests run in Vitest's browser mode, so a real Chromium has to
      # be present — this is not a Playwright e2e run, it is how the Lit
      # components are mounted at all.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test -- --run

      - name: Build
        run: bun run build

      # Fails the build on a high or critical advisory. The release-age gate in
      # bunfig slows a malicious package down; this is what notices a known one.
      - name: Audit
        run: bun run audit
